<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>管事 · 交互原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <aside class="stage-intro">
      <p class="eyebrow">PRODUCT PROTOTYPE · v0.6</p>
      <h1>管事</h1>
      <p class="stage-desc">一个住在云端的 AI 生活管家。短信、通知、截图、一句话都能变成待办；早上告诉你今天做什么，晚上陪你复盘。</p>
      <ol class="stage-tips">
        <li><b>今日</b> 点右上角铃铛看晨报推送，再确认那条 AI 识别出的快递。</li>
        <li><b>全部</b> 切到日历视图，点一下有圆点的日期。</li>
        <li><b>助手</b> 发一句「提醒我明天买花」，或点麦克风说一句。</li>
        <li><b>收藏</b> 点右上角 +，模拟从微信/抖音分享进来一条。</li>
        <li><b>我的</b> 进大模型接入、家人与关系、外观。</li>
      </ol>
      <div class="stage-actions">
        <button data-action="onboard">重播首次引导</button>
        <button data-action="theme">切换外观</button>
      </div>
      <p class="stage-note">纯静态原型 · 数据均为模拟 · 可离线打开</p>
    </aside>

    <div class="device-wrap">
      <div class="device" id="device">
        <div class="statusbar">
          <span class="status-time">9:41</span>
          <span class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.3" y="4.5" width="3" height="7.5" rx="1"/><rect x="8.6" y="2.2" width="3" height="9.8" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="15" height="12" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.5a5 5 0 0 1 6 0"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            <svg width="22" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><path d="M24 4v4a2.4 2.4 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>

        <div class="app">
          <main class="screen">
            <div class="screen-scroll" id="screen-scroll"></div>
            <div class="bottom-slot" id="bottom-slot"></div>
          </main>

          <nav class="tabbar" id="tabbar" aria-label="主导航">
            <button class="tab" data-action="tab" data-tab="today" data-nav="today">
              <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></span>
              <span class="tab-label">今日</span>
            </button>
            <button class="tab" data-action="tab" data-tab="all" data-nav="all">
              <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg></span>
              <span class="tab-label">全部</span>
            </button>
            <button class="tab" data-action="tab" data-tab="chat" data-nav="chat">
              <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4.2-1.1L3 20l1.3-4.4A8.4 8.4 0 1 1 21 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg><i class="tab-dot" id="chat-dot"></i></span>
              <span class="tab-label">助手</span>
            </button>
            <button class="tab" data-action="tab" data-tab="fav" data-nav="fav">
              <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
              <span class="tab-label">收藏</span>
            </button>
            <button class="tab" data-action="tab" data-tab="me" data-nav="me">
              <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <span class="tab-label">我的</span>
            </button>
          </nav>
        </div>

        <div id="overlay-root"></div>

        <div class="splash" id="splash" role="status" aria-label="管事启动中">
          <img class="splash-mark" src="assets/app-icon.png" alt="管事">
          <p class="splash-name">管事</p>
          <p class="splash-tag">你的事，它记得</p>
          <span class="splash-foot">CLOUD AGENT · 云端常驻</span>
        </div>
      </div>
    </div>
  </div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
